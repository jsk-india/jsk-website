version: 2
updates:
  # npm / pnpm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      # Batch minor/patch bumps into one PR to reduce noise
      minor-and-patch:
        update-types:
          - minor
          - patch
      # Payload releases together
      payload:
        patterns:
          - "@payloadcms/*"
          - "payload"
      # Next.js + React together
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "eslint-config-next"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
